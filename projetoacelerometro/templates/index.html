<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Accelerometer Processing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      body { font-family: Arial, sans-serif; margin: 2em; background: #f8f9fa; }
      .box { border: 1px solid #dee2e6; padding: 1.25rem; border-radius: 12px; background: #fff; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <div class="box shadow-sm">
            <h1 class="h3 mb-3">Processamento Automático de Acelerômetro</h1>
            <form method="post" action="/process" enctype="multipart/form-data">
              <div class="mb-3">
                <label class="form-label">Arquivo CSV</label>
                <input type="file" name="file" class="form-control" accept=".csv" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Tarefa</label>
                <select name="task" class="form-select">
                  <option value="extract">Extrair Features</option>
                  <option value="train">Treinar Modelo</option>
                  <option value="predict">Prever</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Modelo salvo (opcional para Prever)</label>
                <input type="file" name="model" class="form-control" accept=".joblib" />
              </div>
              <button type="submit" class="btn btn-primary">Executar</button>
            </form>
            <p class="text-muted mt-3 mb-0">O CSV deve ter as colunas x, y e z. Para treinar, a coluna label é obrigatória.</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
