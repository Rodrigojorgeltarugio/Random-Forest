<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Resultados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      body { font-family: Arial, sans-serif; margin: 2em; background: #f8f9fa; }
      .panel { background: #fff; border: 1px solid #dee2e6; border-radius: 12px; padding: 1.25rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
          <div class="panel shadow-sm">
            <h2 class="h4 mb-3">Resultados</h2>
            {% if result %}
              <div class="mb-3">
                {{ result|safe }}
              </div>
            {% endif %}
            {% if msg %}
              <div class="alert alert-info">{{ msg }}</div>
            {% endif %}
            {% if links %}
              <div class="mt-3">
                <h3 class="h6">Downloads</h3>
                <ul class="mb-0">
                  {% for link in links %}
                    <li><a href="{{ link }}">{{ link.split('/')[-1] }}</a></li>
                  {% endfor %}
                </ul>
              </div>
            {% endif %}
            <div class="mt-4">
              <a class="btn btn-outline-secondary" href="/">Voltar</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
