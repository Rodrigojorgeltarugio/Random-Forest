<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Resultado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>body{font-family:Arial,sans-serif;margin:2em}</style>
  </head>
  <body>
    <h2>Resultados</h2>
    <ul>
      {% for link in links %}
        <li><a href="{{ link }}">Download: {{ link.split('/')[-1] }}</a></li>
      {% endfor %}
    </ul>
    <p><a href="/">Voltar</a></p>

    <div class="mt-4">
      {% if result %}
        {{ result|safe }}
      {% endif %}
    </div>
  </body>
</html>
